name: Flagcat
description: Flagcat is a Paris-based animation and webtoon production studio building ambitious
  action-fantasy anime and webtoon series (including "Writers," "Deadly Hour," and "Impure Blood
  Regression") while redesigning the production pipeline around artist wellness. Its proprietary tool,
  Flagcat Colors, is an AI-powered coloring product for webtoon artists that learns from uploaded
  character references and batch-colorizes line art in one click, exporting layered files for final
  touch-ups. Flagcat Colors is in a pre-beta, waiting-list stage and the studio publishes no public
  API, developer platform, SDKs, or documentation as of this profile. Backed by Seedcamp.
